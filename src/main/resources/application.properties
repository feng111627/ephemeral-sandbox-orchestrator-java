# 随机端口，便于本地并行启动；手工验证时可通过 --server.port=18080 覆盖
server.port=0

# 归属方默认配额上限（也可用 QuotaManager.setLimit 为单个归属方单独设置）
sandbox.quota.default-limit=3

# 有效期上限（秒）：申请 TTL 必须为正数且不超过它；续期后的到期时间不得越过
# “申请时刻 + 该上限”这一绝对上限
sandbox.ttl.max-seconds=86400

# 到期自动回收：开关与扫描间隔（毫秒）
sandbox.reaper.enabled=true
sandbox.reaper.fixed-delay-ms=1000
